x-coverage:
  state: covered
  reason: covered
  detail: >-
    Chalmers is one of the minority of universities in this cohort that operates a first-party API.
    The Chalmers Research API (api.research.chalmers.se) serves a live Swagger 2.0 description over
    25 paths and 46 definitions from the institution's own host, and returns 401 on data reads
    because it is Basic-authenticated — gated, but real and institution-operated, so the 22 refined
    per-tag OpenAPIs in this repo are correctly attributed. Two institution-hosted OAI-PMH
    repositories and a self-hosted DSpace 8.3 REST API were probed live, and a SAML 2.0 identity
    provider registered in SWAMID was retrieved per-entity from the federation's MDQ service.
    DataCite membership and repository accounts were confirmed against DataCite's own API. What
    Chalmers does NOT publish is equally clear: api.chalmers.se, developer.chalmers.se,
    data.chalmers.se and opendata.chalmers.se do not resolve at all, there is no consolidated
    developer portal, no llms.txt and no security.txt, the course catalog is HTML-only (roughly
    thousands of kursplaner pages in the sitemap, no API), and the previously recorded API
    documentation pointer https://api.research.chalmers.se/Help now returns 500 and was replaced with
    the live Swagger UI at /swagger. Teaching, timetabling and data deposit run on vendor tenancies
    (Instructure Canvas, TimeEdit, SND/DORIS) which are recorded as relationships, not as Chalmers
    contracts. One language-barrier note: the institutional rules for the use of AI tools exist only
    on the Swedish surface — the English path 404s.
