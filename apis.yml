---
aid: chalmers-university-of-technology
name: Chalmers University of Technology
description: >-
  Chalmers University of Technology (Chalmers tekniska hogskola) is a private technical university in
  Gothenburg, Sweden, run by the Chalmers Foundation and ranked in the QS World University Rankings.
  Unlike most of the university cohort, Chalmers operates a genuinely institution-owned API: the
  Chalmers Research API at api.research.chalmers.se, a first-party CRIS interface over research
  projects, organizations and publications, described by a live Swagger 2.0 document and protected by
  HTTP Basic authentication (public reads return 401). Around it sit two institution-hosted OAI-PMH
  endpoints — Chalmers Research (records back to 1942) and the Chalmers Open Digital Repository, a
  self-hosted DSpace 8.3 whose REST API answers on odr.chalmers.se — plus a SAML 2.0 identity
  provider registered in SWAMID, the Swedish national federation. Chalmers is a DataCite consortium
  member with its own repository account, and its CRIS carries ORCID iDs. There is no consolidated,
  self-service developer portal, no public open-data portal and no public course-catalog API; the
  teaching, timetable and data-deposit layers run on vendor tenancies (Canvas, TimeEdit, SND) whose
  contracts belong to those vendors, not to Chalmers.
